name: AniApp web preview
# Baut die Flutter-App als Web-Build, damit die UI ohne Emulator
# im Browser angesehen/getestet werden kann. Nur manuell.
on:
  push:
    branches: [ci/web-preview]
  pull_request:
  workflow_dispatch:
env:
  FLUTTER_SUPPRESS_ANALYTICS: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define-from-file=config/supabase.json
      - uses: actions/upload-artifact@v4
        with:
          name: aniapp-web
          path: mobile/build/web
